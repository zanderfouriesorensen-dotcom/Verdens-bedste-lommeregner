
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULTIMATE CALCULATOR</title>
<style>
:root {
  --bg:#0b0e16;
  --panel:#151b2b;
  --panel2:#222b40;
  --text:#ffffff;
  --muted:#929bb2;
  --accent:#8275ff;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
header {
  padding:22px;
  border-bottom:1px solid #30394e;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo {
  font-size:24px;
  font-weight:900;
}
.logo span {color:var(--accent)}
.layout {
  max-width:1300px;
  margin:auto;
  padding:25px;
  display:grid;
  grid-template-columns:210px 1fr;
  gap:20px;
}
.sidebar,.card {
  background:var(--panel);
  padding:18px;
  border-radius:16px;
}
.nav {
  display:block;
  width:100%;
  text-align:left;
  padding:13px;
  margin:4px 0;
  border:0;
  border-radius:9px;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
}
.nav.active,.nav:hover {
  background:var(--panel2);
  color:white;
}
.page {display:none}
.page.active {display:block}
.display {
  background:var(--panel2);
  border-radius:12px;
  padding:20px;
  text-align:right;
  margin:15px 0;
}
.expression {color:var(--muted)}
.result {font-size:40px;margin-top:10px}
.keys {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}
.key {
  padding:17px;
  border:0;
  border-radius:10px;
  background:var(--panel2);
  color:white;
  font-size:18px;
  cursor:pointer;
}
.key:hover {filter:brightness(1.3)}
.op {color:#aaa0ff}
.equal {background:var(--accent)}
input,select,textarea {
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:9px;
  border:1px solid #30394e;
  background:var(--panel2);
  color:white;
}
.primary {
  background:var(--accent);
  color:white;
  padding:12px 20px;
  border:0;
  border-radius:9px;
  cursor:pointer;
}
.output {
  background:var(--panel2);
  padding:15px;
  margin-top:15px;
  border-radius:10px;
  overflow-wrap:anywhere;
}
.history-item {
  padding:12px;
  background:var(--panel2);
  border-radius:9px;
  margin:8px 0;
  cursor:pointer;
}
@media(max-width:750px) {
  .layout {grid-template-columns:1fr;padding:12px}
  .sidebar {display:flex;overflow-x:auto;gap:5px}
  .nav {white-space:nowrap;width:auto}
}
</style>
</head>
<body>
<header>
  <div class="logo">ULTIMATE<span>.</span></div>
  <button onclick="document.body.classList.toggle('light')">◐</button>
</header>

<div class="layout">
<aside class="sidebar">
  <button class="nav active" data-page="calculator">⌗ Lommeregner</button>
  <button class="nav" data-page="scientific">∑ Videnskabelig</button>
  <button class="nav" data-page="fractions">½ Brøker</button>
  <button class="nav" data-page="geometry">△ Geometri</button>
  <button class="nav" data-page="statistics">▥ Statistik</button>
  <button class="nav" data-page="finance">◈ Finans</button>
  <button class="nav" data-page="converter">⇄ Omregner</button>
  <button class="nav" data-page="programmer">⌘ Programmer</button>
  <button class="nav" data-page="equations">x Ligninger</button>
</aside>

<main>
<section class="page active" id="calculator">
<h1>Lommeregner</h1>
<div class="card">
<div class="display">
<div class="expression" id="expression">Klar</div>
<div class="result" id="result">0</div>
</div>
<div class="keys">
<button class="key" onclick="clearCalc()">AC</button>
<button class="key" onclick="insert('(')">(</button>
<button class="key" onclick="insert(')')">)</button>
<button class="key op" onclick="insert('/')">÷</button>
<button class="key" onclick="insert('7')">7</button>
<button class="key" onclick="insert('8')">8</button>
<button class="key" onclick="insert('9')">9</button>
<button class="key op" onclick="insert('*')">×</button>
<button class="key" onclick="insert('4')">4</button>
<button class="key" onclick="insert('5')">5</button>
<button class="key" onclick="insert('6')">6</button>
<button class="key op" onclick="insert('-')">−</button>
<button class="key" onclick="insert('1')">1</button>
<button class="key" onclick="insert('2')">2</button>
<button class="key" onclick="insert('3')">3</button>
<button class="key op" onclick="insert('+')">+</button>
<button class="key" onclick="insert('0')">0</button>
<button class="key" onclick="insert('.')">.</button>
<button class="key" onclick="backspace()">⌫</button>
<button class="key equal" onclick="calculate()">=</button>
</div>
</div>
<div class="card">
<h3>Historik</h3>
<div id="history"></div>
</div>
</section>

<section class="page" id="scientific">
<h1>Videnskabelig beregner</h1>
<div class="card">
<input id="sciInput" placeholder="Eksempel: sqrt(25) + sin(30)">
<select id="angleMode">
<option value="deg">Grader</option>
<option value="rad">Radianer</option>
</select>
<button class="primary" onclick="scientificCalc()">Beregn</button>
<div class="output" id="sciOutput"></div>
</div>
</section>

<section class="page" id="fractions">
<h1>Brøkberegner</h1>
<div class="card">
<label>Tæller 1</label><input id="fa" type="number" value="1">
<label>Nævner 1</label><input id="fb" type="number" value="2">
<label>Tæller 2</label><input id="fc" type="number" value="1">
<label>Nævner 2</label><input id="fd" type="number" value="3">
<select id="fop">
<option value="+">Addition</option>
<option value="-">Subtraktion</option>
<option value="*">Multiplikation</option>
<option value="/">Division</option>
</select>
<button class="primary" onclick="fractionCalc()">Beregn</button>
<div class="output" id="fractionOutput"></div>
</div>
</section>

<section class="page" id="geometry">
<h1>Geometri</h1>
<div class="card">
<select id="shape" onchange="geometryFields()">
<option value="circle">Cirkel</option>
<option value="rectangle">Rektangel</option>
<option value="triangle">Trekant</option>
<option value="square">Kvadrat</option>
<option value="sphere">Kugle</option>
<option value="cube">Terning</option>
<option value="cylinder">Cylinder</option>
<option value="cone">Kegle</option>
</select>
<div id="geometryInputs"></div>
<button class="primary" onclick="geometryCalc()">Beregn</button>
<div class="output" id="geometryOutput"></div>
</div>
</section>

<section class="page" id="statistics">
<h1>Statistik</h1>
<div class="card">
<textarea id="statInput" placeholder="Indtast tal: 10, 20, 30"></textarea>
<button class="primary" onclick="statisticsCalc()">Analyser</button>
<div class="output" id="statOutput"></div>
</div>
</section>

<section class="page" id="finance">
<h1>Finans</h1>
<div class="card">
<select id="finType" onchange="financeFields()">
<option value="compound">Renters rente</option>
<option value="loan">Lån</option>
<option value="vat">Moms</option>
<option value="discount">Rabat</option>
</select>
<div id="financeInputs"></div>
<button class="primary" onclick="financeCalc()">Beregn</button>
<div class="output" id="financeOutput"></div>
</div>
</section>

<section class="page" id="converter">
<h1>Enhedsomregner</h1>
<div class="card">
<select id="convType" onchange="converterUnits()">
<option value="length">Længde</option>
<option value="weight">Vægt</option>
<option value="temp">Temperatur</option>
<option value="time">Tid</option>
<option value="volume">Rumfang</option>
</select>
<input id="convValue" type="number" value="1">
<select id="convFrom"></select>
<select id="convTo"></select>
<button class="primary" onclick="convert()">Konverter</button>
<div class="output" id="convOutput"></div>
</div>
</section>

<section class="page" id="programmer">
<h1>Programmerberegner</h1>
<div class="card">
<input id="progInput" value="255">
<select id="progBase">
<option value="10">Decimal</option>
<option value="2">Binær</option>
<option value="8">Oktal</option>
<option value="16">Hexadecimal</option>
</select>
<button class="primary" onclick="programmerCalc()">Konverter</button>
<div class="output" id="progOutput"></div>
</div>
</section>

<section class="page" id="equations">
<h1>Ligningsløser</h1>
<div class="card">
<h3>ax + b = c</h3>
<input id="la" type="number" value="2">
<input id="lb" type="number" value="4">
<input id="lc" type="number" value="10">
<button class="primary" onclick="linearEquation()">Løs</button>
<div class="output" id="linearOutput"></div>
</div>
</section>
</main>
</div>
<footer>ULTIMATE CALCULATOR</footer>
</body>
</html>

<script>
const $ = id => document.getElementById(id);
const fmt = n => Number(n.toPrecision(12)).toLocaleString('da-DK',{maximumFractionDigits:10});

let expression = '';
let historyItems = JSON.parse(localStorage.getItem('uc-history') || '[]');

// NAVIGATION
document.querySelectorAll('.nav').forEach(button => {
  button.addEventListener('click', () => {
    document.querySelectorAll('.nav').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    button.classList.add('active');
    $(button.dataset.page).classList.add('active');
  });
});

// LOMMEREGNER
function insert(value) {
  expression += value;
  $('expression').textContent = expression;
  $('result').textContent = '...';
}

function clearCalc() {
  expression = '';
  $('expression').textContent = 'Klar';
  $('result').textContent = '0';
}

function backspace() {
  expression = expression.slice(0,-1);
  $('expression').textContent = expression || 'Klar';
}

function calculate() {
  if (!expression.trim()) return;
  try {
    const result = evaluate(expression);
    if (typeof result !== 'number' || !Number.isFinite(result))
      throw Error('Ugyldigt resultat');

    $('result').textContent = fmt(result);

    historyItems.unshift({
      expression,
      result: fmt(result)
    });

    historyItems = historyItems.slice(0,30);
    localStorage.setItem('uc-history',JSON.stringify(historyItems));
    renderHistory();
  } catch(error) {
    $('result').textContent = 'Fejl';
    $('expression').textContent = error.message;
  }
}

function evaluate(input, mode='rad') {
  if (!window.math) throw Error('Matematikbibliotek mangler.');

  const angle = mode === 'deg' ? Math.PI/180 : 1;
  const outputAngle = mode === 'deg' ? 180/Math.PI : 1;

  return math.evaluate(input,{
    pi:Math.PI,
    e:Math.E,
    sin:x=>Math.sin(x*angle),
    cos:x=>Math.cos(x*angle),
    tan:x=>Math.tan(x*angle),
    asin:x=>Math.asin(x)*outputAngle,
    acos:x=>Math.acos(x)*outputAngle,
    atan:x=>Math.atan(x)*outputAngle
  });
}

function renderHistory() {
  $('history').innerHTML = historyItems.map((item,index)=>`
    <div class="history-item" onclick="useHistory(${index})">
      <small>${escapeHTML(item.expression)}</small>
      <b>${escapeHTML(item.result)}</b>
    </div>
  `).join('') || 'Ingen beregninger endnu.';
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

function useHistory(index) {
  expression = historyItems[index].expression;
  $('expression').textContent = expression;
  $('result').textContent = historyItems[index].result;
}

renderHistory();

// TASTATUR
document.addEventListener('keydown',event=>{
  if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) return;

  if(/^[0-9.+\-*/^()]$/.test(event.key)) insert(event.key);
  if(event.key==='Enter'||event.key==='=') calculate();
  if(event.key==='Backspace') backspace();
  if(event.key==='Escape') clearCalc();
});

// VIDENSKABELIG
function scientificCalc() {
  try {
    const result = evaluate(
      $('sciInput').value,
      $('angleMode').value
    );
    $('sciOutput').textContent = String(result);
  } catch(error) {
    $('sciOutput').textContent = 'Fejl: '+error.message;
  }
}

// BRØKER
function gcd(a,b) {
  a=Math.abs(a);
  b=Math.abs(b);
  while(b) [a,b]=[b,a%b];
  return a||1;
}

function fractionCalc() {
  const a=+$('fa').value;
  const b=+$('fb').value;
  const c=+$('fc').value;
  const d=+$('fd').value;

  if(![a,b,c,d].every(Number.isSafeInteger)||b===0||d===0) {
    $('fractionOutput').textContent='Ugyldig brøk.';
    return;
  }

  let n,den;

  switch($('fop').value) {
    case '+': n=a*d+c*b; den=b*d; break;
    case '-': n=a*d-c*b; den=b*d; break;
    case '*': n=a*c; den=b*d; break;
    case '/':
      if(c===0) {
        $('fractionOutput').textContent='Division med nul.';
        return;
      }
      n=a*d; den=b*c;
      break;
  }

  if(den<0) {
    n=-n;
    den=-den;
  }

  const divisor=gcd(n,den);
  n/=divisor;
  den/=divisor;

  $('fractionOutput').textContent=
    `Resultat: ${n}/${den} = ${fmt(n/den)}`;
}

// GEOMETRI
const shapes = {
  circle:['Radius'],
  rectangle:['Længde','Bredde'],
  triangle:['Grundlinje','Højde'],
  square:['Side'],
  sphere:['Radius'],
  cube:['Side'],
  cylinder:['Radius','Højde'],
  cone:['Radius','Højde']
};

function geometryFields() {
  $('geometryInputs').innerHTML =
    shapes[$('shape').value].map((name,index)=>`
      <label>${name}</label>
      <input type="number" id="geo${index}" min="0" step="any">
    `).join('');
}

function geometryCalc() {
  const shape=$('shape').value;
  const values=shapes[shape].map((_,i)=>+$('geo'+i).value);

  if(values.some(v=>!Number.isFinite(v)||v<=0)) {
    $('geometryOutput').textContent='Indtast positive tal.';
    return;
  }

  const [a,b]=values;
  let result='';

  switch(shape) {
    case 'circle':
      result=`Areal: ${fmt(Math.PI*a*a)}
      Omkreds: ${fmt(2*Math.PI*a)}`;
      break;

    case 'rectangle':
      result=`Areal: ${fmt(a*b)}
      Omkreds: ${fmt(2*(a+b))}`;
      break;

    case 'triangle':
      result=`Areal: ${fmt(a*b/2)}`;
      break;

    case 'square':
      result=`Areal: ${fmt(a*a)}
      Omkreds: ${fmt(4*a)}`;
      break;

    case 'sphere':
      result=`Rumfang: ${fmt(4*Math.PI*a**3/3)}
      Overflade: ${fmt(4*Math.PI*a*a)}`;
      break;

    case 'cube':
      result=`Rumfang: ${fmt(a**3)}
      Overflade: ${fmt(6*a*a)}`;
      break;

    case 'cylinder':
      result=`Rumfang: ${fmt(Math.PI*a*a*b)}
      Overflade: ${fmt(2*Math.PI*a*(a+b))}`;
      break;

    case 'cone':
      result=`Rumfang: ${fmt(Math.PI*a*a*b/3)}
      Overflade: ${fmt(Math.PI*a*(a+Math.hypot(a,b)))}`;
      break;
  }

  $('geometryOutput').textContent=result;
}

geometryFields();

// STATISTIK
function statisticsCalc() {
  const data=$('statInput').value
    .trim()
    .split(/[\s,;]+/)
    .filter(Boolean)
    .map(Number);

  if(!data.length||data.some(n=>!Number.isFinite(n))) {
    $('statOutput').textContent='Indtast gyldige tal.';
    return;
  }

  const sorted=[...data].sort((a,b)=>a-b);
  const n=data.length;
  const mean=data.reduce((a,b)=>a+b,0)/n;
  const median=n%2
    ? sorted[(n-1)/2]
    : (sorted[n/2-1]+sorted[n/2])/2;

  const frequencies={};
  data.forEach(x=>frequencies[x]=(frequencies[x]||0)+1);

  const maxFrequency=Math.max(...Object.values(frequencies));
  const modes=Object.keys(frequencies)
    .filter(x=>frequencies[x]===maxFrequency)
    .join(', ');

  const variance=data.reduce((sum,x)=>sum+(x-mean)**2,0)/n;
  const standardDeviation=Math.sqrt(variance);

  $('statOutput').innerHTML=`
    <b>Antal:</b> ${n}<br>
    <b>Gennemsnit:</b> ${fmt(mean)}<br>
    <b>Median:</b> ${fmt(median)}<br>
    <b>Typetal:</b> ${escapeHTML(modes)}<br>
    <b>Minimum:</b> ${sorted[0]}<br>
    <b>Maksimum:</b> ${sorted[n-1]}<br>
    <b>Varians:</b> ${fmt(variance)}<br>
    <b>Standardafvigelse:</b> ${fmt(standardDeviation)}<br>
    <b>Spændvidde:</b> ${fmt(sorted[n-1]-sorted[0])}
  `;
}

// FINANS
const financeDefinitions = {
  compound:[['Beløb',10000],['Årlig rente (%)',5],['År',10]],
  loan:[['Lånebeløb',200000],['Årlig rente (%)',5],['Løbetid (år)',20]],
  vat:[['Beløb',1000],['Moms (%)',25]],
  discount:[['Normalpris',1000],['Rabat (%)',20]]
};

function financeFields() {
  $('financeInputs').innerHTML =
    financeDefinitions[$('finType').value].map((item,index)=>`
      <label>${item[0]}</label>
      <input type="number" id="fin${index}" value="${item[1]}" min="0">
    `).join('');
}

function financeCalc() {
  const type=$('finType').value;
  const a=+$('fin0').value;
  const r=+$('fin1').value/100;
  const y=+$('fin2')?.value||0;

  if(!Number.isFinite(a)||!Number.isFinite(r)||a<0||r<0) {
    $('financeOutput').textContent='Ugyldige værdier.';
    return;
  }

  let result='';

  if(type==='compound') {
    const total=a*(1+r)**y;
    result=`Slutbeløb: ${fmt(total)}
    Optjent rente: ${fmt(total-a)}`;
  }

  if(type==='loan') {
    if(y<=0) {
      result='Løbetiden skal være større end nul.';
    } else {
      const months=y*12;
      const monthlyRate=r/12;
      const payment=monthlyRate===0
        ? a/months
        : a*monthlyRate/(1-(1+monthlyRate)**(-months));

      result=`Månedlig ydelse: ${fmt(payment)}
      Samlet betaling: ${fmt(payment*months)}
      Renter: ${fmt(payment*months-a)}`;
    }
  }

  if(type==='vat') {
    result=`Pris med moms: ${fmt(a*(1+r))}
    Momsbeløb: ${fmt(a*r)}`;
  }

  if(type==='discount') {
    result=`Pris efter rabat: ${fmt(a*(1-r))}
    Besparelse: ${fmt(a*r)}`;
  }

  $('financeOutput').textContent=result;
}

financeFields();

// ENHEDSOMREGNER
const units={
  length:{m:1,km:1000,cm:.01,mm:.001,ft:.3048,in:.0254,mi:1609.344},
  weight:{kg:1,g:.001,mg:.000001,lb:.45359237,oz:.0283495},
  time:{s:1,min:60,h:3600,day:86400,week:604800},
  volume:{m3:1,l:.001,ml:.000001,gal:.003785411784}
};

function converterUnits() {
  const type=$('convType').value;
  const options=type==='temp'
    ? ['°C','°F','K']
    : Object.keys(units[type]);

  $('convFrom').innerHTML=options.map(x=>`<option>${x}</option>`).join('');
  $('convTo').innerHTML=options.map(x=>`<option>${x}</option>`).join('');

  if(options.length>1) $('convTo').selectedIndex=1;
}

function convert() {
  const type=$('convType').value;
  const value=+$('convValue').value;
  const from=$('convFrom').value;
  const to=$('convTo').value;

  if(!Number.isFinite(value)) {
    $('convOutput').textContent='Ugyldigt tal.';
    return;
  }

  let result;

  if(type==='temp') {
    let c=from==='°C'?value:
      from==='°F'?(value-32)*5/9:value-273.15;

    result=to==='°C'?c:
      to==='°F'?c*9/5+32:c+273.15;
  } else {
    result=value*units[type][from]/units[type][to];
  }

  $('convOutput').textContent=
    `${fmt(value)} ${from} = ${fmt(result)} ${to}`;
}

converterUnits();

// PROGRAMMERBEREGNER
function programmerCalc() {
  const raw=$('progInput').value.trim().replace(/^0x/i,'');
  const base=+$('progBase').value;

  const patterns={
    2:/^[01]+$/,
    8:/^[0-7]+$/,
    10:/^\d+$/,
    16:/^[0-9a-f]+$/i
  };

  if(!patterns[base].test(raw)) {
    $('progOutput').textContent='Ugyldigt tal.';
    return;
  }

  try {
    let value=0n;

    for(const char of raw.toLowerCase()) {
      value=value*BigInt(base)+BigInt(parseInt(char,16));
    }

    $('progOutput').innerHTML=`
      Decimal: <b>${value.toString(10)}</b><br>
      Binær: <b>${value.toString(2)}</b><br>
      Oktal: <b>${value.toString(8)}</b><br>
      Hexadecimal: <b>${value.toString(16).toUpperCase()}</b>
    `;
  } catch(error) {
    $('progOutput').textContent='Kunne ikke konvertere tallet.';
  }
}

// LINEÆR LIGNING
function linearEquation() {
  const a=+$('la').value;
  const b=+$('lb').value;
  const c=+$('lc').value;

  if(![a,b,c].every(Number.isFinite)) return;

  if(a===0) {
    $('linearOutput').textContent=
      b===c?'Uendeligt mange løsninger.':'Ingen løsning.';
  } else {
    $('linearOutput').textContent=`x = ${fmt((c-b)/a)}`;
  }
}

// START
</script>
</body>
</html>
