
<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verdens bedste lommeregner</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.2.0/math.min.js"></script>

<style>
:root {
  --bg: #0b0e16;
  --panel: #151b2b;
  --panel2: #222b40;
  --text: #ffffff;
  --muted: #929bb2;
  --accent: #8275ff;
  --border: #343d52;
}

body.light {
  --bg: #f1f3f9;
  --panel: #ffffff;
  --panel2: #e5e9f3;
  --text: #161a29;
  --muted: #626b80;
  --accent: #6655dd;
  --border: #d5dbea;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  transition: background .2s, color .2s;
}

header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--panel);
  z-index: 10;
}

.logo {
  font-size: 23px;
  font-weight: 900;
}

.logo span {
  color: var(--accent);
}

button, input, select, textarea {
  font-family: inherit;
}

.layout {
  max-width: 1400px;
  margin: auto;
  padding: 24px;
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 22px;
}

.sidebar {
  background: var(--panel);
  padding: 15px;
  border-radius: 16px;
  height: fit-content;
}

.nav {
  display: block;
  width: 100%;
  text-align: left;
  padding: 13px;
  margin: 4px 0;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
}

.nav:hover,
.nav.active {
  background: var(--panel2);
  color: var(--text);
}

.page {
  display: none;
}

.page.active {
  display: block;
}

.card {
  background: var(--panel);
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 18px;
  border: 1px solid var(--border);
}

h1 {
  font-size: 27px;
  margin-top: 5px;
}

h2 {
  font-size: 21px;
}

.display {
  background: var(--panel2);
  border-radius: 12px;
  padding: 20px;
  text-align: right;
  margin: 15px 0;
  overflow-wrap: anywhere;
}

.expression {
  color: var(--muted);
  min-height: 20px;
}

.result {
  font-size: 38px;
  margin-top: 10px;
}

.keys {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 9px;
}

.key {
  padding: 17px 8px;
  border: 0;
  border-radius: 10px;
  background: var(--panel2);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
}

.key:hover {
  filter: brightness(1.3);
}

.key.op {
  color: var(--accent);
}

.key.equal,
.primary {
  background: var(--accent);
  color: white;
}

input, select, textarea {
  width: 100%;
  padding: 13px;
  margin: 8px 0;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--panel2);
  color: var(--text);
}

.primary {
  padding: 13px 20px;
  border: 0;
  border-radius: 9px;
  cursor: pointer;
}

.output {
  background: var(--panel2);
  padding: 16px;
  margin-top: 15px;
  border-radius: 10px;
  overflow-wrap: anywhere;
  white-space: pre-line;
  line-height: 1.7;
}

.history-item {
  padding: 12px;
  background: var(--panel2);
  border-radius: 9px;
  margin: 8px 0;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 30px;
  color: var(--muted);
}

@media(max-width: 750px) {
  .layout {
    grid-template-columns: 1fr;
    padding: 12px;
  }

  .sidebar {
    display: flex;
    overflow-x: auto;
    gap: 5px;
  }

  .nav {
    white-space: nowrap;
    width: auto;
    flex-shrink: 0;
  }

  .result {
    font-size: 30px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ULTIMATE<span>.</span></div>
  <button class="primary" onclick="toggleTheme()">◐ Tema</button>
</header>

<div class="layout">

<aside class="sidebar">

<button class="nav active" data-page="calculator">⌗ Lommeregner</button>
<button class="nav" data-page="scientific">∑ Videnskabelig</button>
<button class="nav" data-page="fractions">½ Brøker</button>
<button class="nav" data-page="geometry">△ Geometri</button>
<button class="nav" data-page="statistics">▥ Statistik</button>
<button class="nav" data-page="finance">◈ Finans</button>
<button class="nav" data-page="converter">⇄ Omregner</button>
<button class="nav" data-page="programmer">⌘ Programmer</button>
<button class="nav" data-page="equations">x Ligninger</button>

</aside>

<main>

<section class="page active" id="calculator">
<h1>Lommeregner</h1>
<div class="card">
<div class="display">
<div class="expression" id="expression">Klar</div>
<div class="result" id="result">0</div>
</div>
<div class="keys" id="calculatorKeys"></div>
</div>
<div class="card">
<h2>Historik</h2>
<div id="history">Ingen beregninger endnu.</div>
</div>
</section>

<section class="page" id="scientific">
<h1>Videnskabelig beregner</h1>
<div class="card" id="scientificContent"></div>
</section>

<section class="page" id="fractions">
<h1>Brøkberegner</h1>
<div class="card" id="fractionContent"></div>
</section>

<section class="page" id="geometry">
<h1>Geometri</h1>
<div class="card" id="geometryContent"></div>
</section>

<section class="page" id="statistics">
<h1>Statistik</h1>
<div class="card" id="statisticsContent"></div>
</section>

<section class="page" id="finance">
<h1>Finans</h1>
<div class="card" id="financeContent"></div>
</section>

<section class="page" id="converter">
<h1>Enhedsomregner</h1>
<div class="card" id="converterContent"></div>
</section>

<section class="page" id="programmer">
<h1>Programmerberegner</h1>
<div class="card" id="programmerContent"></div>
</section>

<section class="page" id="equations">
<h1>Ligningsløser</h1>
<div class="card" id="equationsContent"></div>
</section>

</main>
</div>

<footer>
ULTIMATE CALCULATOR © 2026
</footer>

<!-- DEL 2 INDSÆTTES HER -->

<!-- DEL 3 INDSÆTTES HER -->

<!-- DEL 4 INDSÆTTES HER -->

</body>
</html>

<script>

// ========================================
// DEL 2 - LOMMEREGNER
// ========================================

const $ = id => document.getElementById(id);

let expression = '';
let historyItems = [];

try {
  historyItems = JSON.parse(
    localStorage.getItem('ultimate-history') || '[]'
  );
  if (!Array.isArray(historyItems)) historyItems = [];
} catch(e) {
  historyItems = [];
}

// TEMA
function toggleTheme() {
  document.body.classList.toggle('light');

  localStorage.setItem(
    'ultimate-theme',
    document.body.classList.contains('light') ? 'light' : 'dark'
  );
}

if (localStorage.getItem('ultimate-theme') === 'light') {
  document.body.classList.add('light');
}

// MENU
document.querySelectorAll('.nav').forEach(button => {
  button.addEventListener('click', () => {

    document.querySelectorAll('.nav').forEach(b =>
      b.classList.remove('active')
    );

    document.querySelectorAll('.page').forEach(p =>
      p.classList.remove('active')
    );

    button.classList.add('active');

    $(button.dataset.page).classList.add('active');
  });
});

// LOMMEREGNERENS KNAPPER
const calculatorButtons = [
  ['AC','clear'], ['(', '('], [')', ')'], ['÷','/'],
  ['7','7'], ['8','8'], ['9','9'], ['×','*'],
  ['4','4'], ['5','5'], ['6','6'], ['−','-'],
  ['1','1'], ['2','2'], ['3','3'], ['+','+'],
  ['0','0'], ['.','.'], ['⌫','back'], ['=','equal']
];

$('calculatorKeys').innerHTML = calculatorButtons.map(item => {

  let cls = 'key';

  if (['+','-','*','/'].includes(item[1])) cls += ' op';
  if (item[1] === 'equal') cls += ' equal';

  return `
    <button class="${cls}"
      onclick="calculatorAction('${item[1]}')">
      ${item[0]}
    </button>
  `;

}).join('');

// INDSÆT TAL OG TEGN
function insert(value) {

  expression += value;

  $('expression').textContent = expression;
  $('result').textContent = '...';

}

// LOMMEREGNERENS HANDLINGER
function calculatorAction(action) {

  if (action === 'clear') {
    clearCalc();
    return;
  }

  if (action === 'back') {
    backspace();
    return;
  }

  if (action === 'equal') {
    calculate();
    return;
  }

  insert(action);

}

// NULSTIL
function clearCalc() {

  expression = '';

  $('expression').textContent = 'Klar';
  $('result').textContent = '0';

}

// SLET SIDSTE TEGN
function backspace() {

  expression = expression.slice(0, -1);

  $('expression').textContent = expression || 'Klar';
  $('result').textContent = '0';

}

// FORMATTER RESULTAT
function formatNumber(value) {

  if (typeof value !== 'number' || !Number.isFinite(value)) {
    throw new Error('Ugyldigt resultat');
  }

  return Number(value.toPrecision(12)).toLocaleString('da-DK', {
    maximumFractionDigits: 10
  });

}

// BEREGN
function calculate() {

  if (!expression.trim()) return;

  try {

    const result = math.evaluate(expression);

    if (typeof result !== 'number' || !Number.isFinite(result)) {
      throw new Error('Ugyldigt resultat');
    }

    const formatted = formatNumber(result);

    $('result').textContent = formatted;

    historyItems.unshift({
      expression: expression,
      result: formatted
    });

    historyItems = historyItems.slice(0, 30);

    try {
      localStorage.setItem(
        'ultimate-history',
        JSON.stringify(historyItems)
      );
    } catch(e) {}

    renderHistory();

  } catch(error) {

    $('result').textContent = 'Fejl';

  }

}

// HISTORIK
function renderHistory() {

  $('history').innerHTML = '';

  if (!historyItems.length) {
    $('history').textContent = 'Ingen beregninger endnu.';
    return;
  }

  historyItems.forEach((item, index) => {

    const div = document.createElement('div');

    div.className = 'history-item';

    const expressionText = document.createElement('div');
    expressionText.textContent = item.expression;

    const resultText = document.createElement('b');
    resultText.textContent = item.result;

    div.appendChild(expressionText);
    div.appendChild(resultText);

    div.onclick = () => {

      expression = item.expression;

      $('expression').textContent = expression;
      $('result').textContent = item.result;

    };

    $('history').appendChild(div);

  });

}

renderHistory();

// TASTATUR
document.addEventListener('keydown', event => {

  if (
    ['INPUT','TEXTAREA','SELECT'].includes(
      document.activeElement.tagName
    )
  ) return;

  if (/^[0-9.+\-*/^()]$/.test(event.key)) {
    insert(event.key);
  }

  if (event.key === 'Enter' || event.key === '=') {
    event.preventDefault();
    calculate();
  }

  if (event.key === 'Backspace') {
    backspace();
  }

  if (event.key === 'Escape') {
    clearCalc();
  }

});

// ========================================
// VIDENSKABELIG BEREGNER
// ========================================

$('scientificContent').innerHTML = `

  <h2>Matematiske funktioner</h2>

  <input
    id="sciInput"
    placeholder="Eksempel: sqrt(25) + sin(30)"
  >

  <select id="angleMode">
    <option value="deg">Grader</option>
    <option value="rad">Radianer</option>
  </select>

  <button class="primary" onclick="scientificCalc()">
    Beregn
  </button>

  <div class="output" id="sciOutput">
    Resultatet vises her.
  </div>

  <h3>Funktioner</h3>

  <div class="keys">

    <button class="key" onclick="sciInsert('sin(')">sin</button>
    <button class="key" onclick="sciInsert('cos(')">cos</button>
    <button class="key" onclick="sciInsert('tan(')">tan</button>
    <button class="key" onclick="sciInsert('sqrt(')">√</button>

    <button class="key" onclick="sciInsert('log(')">log</button>
    <button class="key" onclick="sciInsert('log10(')">log10</button>
    <button class="key" onclick="sciInsert('exp(')">exp</button>
    <button class="key" onclick="sciInsert('pi')">π</button>

    <button class="key" onclick="sciInsert('^2')">x²</button>
    <button class="key" onclick="sciInsert('^3')">x³</button>
    <button class="key" onclick="sciInsert('^')">xʸ</button>
    <button class="key" onclick="sciInsert('!')">x!</button>

  </div>

  <p>
    Eksempler:
    sin(30), cos(60), sqrt(144), log(100),
    5^3, pi, factorial(5)
  </p>

`;

// INDSÆT VIDENSKABELIG FUNKTION
function sciInsert(value) {

  const input = $('sciInput');

  input.value += value;
  input.focus();

}

// VIDENSKABELIG BEREGNING
function scientificCalc() {

  const input = $('sciInput').value.trim();

  if (!input) {
    $('sciOutput').textContent = 'Indtast et matematisk udtryk.';
    return;
  }

  try {

    const mode = $('angleMode').value;

    const angle = mode === 'deg' ? Math.PI / 180 : 1;
    const outputAngle = mode === 'deg' ? 180 / Math.PI : 1;

    const scope = {

      pi: Math.PI,
      e: Math.E,

      sin: x => Math.sin(x * angle),
      cos: x => Math.cos(x * angle),
      tan: x => Math.tan(x * angle),

      asin: x => Math.asin(x) * outputAngle,
      acos: x => Math.acos(x) * outputAngle,
      atan: x => Math.atan(x) * outputAngle,

      sqrt: Math.sqrt,
      abs: Math.abs,
      log: Math.log,
      log10: Math.log10,
      exp: Math.exp,
      factorial: math.factorial

    };

    const result = math.evaluate(input, scope);

    if (typeof result !== 'number' || !Number.isFinite(result)) {
      throw new Error('Ugyldigt resultat');
    }

    $('sciOutput').textContent = formatNumber(result);

  } catch(error) {

    $('sciOutput').textContent =
      'Fejl: Kontroller dit matematiske udtryk.';

  }

}

// ========================================
// SLUT PÅ DEL 2
// ========================================

</script>
